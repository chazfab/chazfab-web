<body data-root-prefix="./">
  <!-- Mobile Swipe-to-Dismiss Navigation Drawer (< 680px) -->
  <dialog class="Drawer" id="mobileDrawer" aria-label="Mainframe navigation drawer">
    <div class="Drawer-scroller">
      <nav class="Drawer-sheet" aria-label="Mobile menu">
        <div class="drawer-header">
          <span class="drawer-title">CHAZFAB</span>
          <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close menu" autofocus>[X]</button>
        </div>
        <ul class="drawer-list">
          <li><a class="drawer-link" href="./index.html" aria-current="page"><span>[MAINFRAME]</span></a></li>
          <li><a class="drawer-link" href="./games.html"><span>[GAMES]</span></a></li>
          <li><a class="drawer-link" href="./projects.html"><span>[PROJECTS]</span></a></li>

          <li><a class="drawer-link" href="./sysop.html"><span>[SYSOP]</span></a></li>
        </ul>
      </nav>
    </div>
  </dialog>

  <div class="mainframe-shell" id="mainframeShell">
    <div class="tron-grid-wrap" aria-hidden="true">
      <div class="tron-horizon"></div>
      <div class="tron-grid-plane"></div>
    </div>
    <div class="scanlines-layer" aria-hidden="true"></div>

    <!-- Zone 1: Slim Unified Cyber-Violet Header -->
    <header class="mainframe-topbar">
      <a class="brand-logo-link" href="./index.html" aria-label="CHAZFAB Home">
        <img class="brand-logo-img" src="./assets/svg/chazfab-pixel-logo.svg" alt="CHAZFAB" width="256" height="52">
      </a>

      <nav class="top-nav" aria-label="Primary navigation">
        <a class="nav-tab" href="./index.html" aria-current="page">[MAINFRAME *]</a>
        <a class="nav-tab" href="./games.html">[GAMES]</a>
        <a class="nav-tab" href="./projects.html">[PROJECTS]</a>
        <a class="nav-tab" href="./labs.html">[LABS]</a>
        <a class="nav-tab" href="./sysop.html">[SYSOP]</a>
      </nav>

      <div class="topbar-right">
        <a class="avatar-pill-link" href="./sysop.html" title="SYSOP // Chaz" aria-label="SYSOP Chaz profile">
          <img class="avatar-pill-img" src="./assets/chazfab-avatar.png" alt="" width="38" height="38">
        </a>
        <button
          type="button"
          class="mobile-menu-trigger"
          id="drawerOpenBtn"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileDrawer"
        >[&equiv; MENU]</button>
      </div>
    </header>

    <!-- Zone 2: Spacious 2x2 Visual Category Hub -->
    <main class="mainframe-stage">
      <h1 class="visually-hidden">CHAZFAB Mainframe Hub</h1>

      <section class="hub-grid" aria-label="Mainframe sectors">
        <!-- Card 1: Game Studio -->
        <article class="clean-card clean-card--green">
          <div class="card-head">
            <h2 class="card-title">Game Studio</h2>
            <span class="status-pill status-pill--live">1 LIVE</span>
          </div>
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
              <rect x="10" y="12" width="142" height="126" rx="3" fill="#020804" stroke="#00ff41" stroke-width="1.6"/>
              <path d="M10 38 H152 M10 64 H152 M10 90 H152 M10 116 H152 M46 12 V138 M82 12 V138 M118 12 V138" stroke="#00ff41" stroke-opacity="0.32" stroke-width="1"/>
              <text x="20" y="30" fill="#00ff41" font-family="monospace" font-size="11">3   6   9  12</text>
              <text x="20" y="56" fill="#00e5ff" font-family="monospace" font-size="11">15  4  21  24</text>
              <rect x="89" y="69" width="22" height="16" rx="3" fill="#00ff41"/>
              <circle cx="96" cy="75" r="2" fill="#020406"/><circle cx="105" cy="75" r="2" fill="#020406"/>
              <text x="170" y="42" fill="#00ff41" font-family="monospace" font-size="12" font-weight="700">NUMBER MUNCHERS</text>
              <text x="170" y="58" fill="#8ec9a9" font-family="monospace" font-size="10">Playable Remake</text>
              <polygon points="242,76 286,128 198,128" fill="none" stroke="#9d4edd" stroke-width="1.6"/>
              <line x1="216" y1="104" x2="268" y2="104" stroke="#00e5ff" stroke-width="1.2"/>
              <text x="170" y="136" fill="#9d4edd" font-family="monospace" font-size="10">CLIMB FOOD CHAIN</text>
            </svg>
          </div>
          <a class="enter-btn" href="./games.html">[ENTER]</a>
        </article>

        <!-- Card 2: 3D & Hardware -->
        <article class="clean-card">
          <div class="card-head">
            <h2 class="card-title">3D &amp; Hardware</h2>
            <span class="status-pill status-pill--wip">WIP</span>
          </div>
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="145" cy="96" rx="74" ry="24" fill="none" stroke="#00ff41" stroke-width="2"/>
              <ellipse cx="145" cy="105" rx="80" ry="26" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
              <path d="M114 66 L145 50 L176 66 V92 L145 108 L114 92 Z" fill="none" stroke="#00ff41" stroke-width="1.8"/>
              <path d="M114 66 L145 82 L176 66 M145 82 V108" fill="none" stroke="#00ff41" stroke-width="1.3"/>
              <rect x="242" y="28" width="32" height="22" fill="none" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="242" y1="39" x2="176" y2="76" stroke="#ff2800" stroke-width="1.5" stroke-dasharray="4 3"/>
              <line x1="258" y1="50" x2="246" y2="128" stroke="#00e5ff" stroke-width="1.4"/>
              <line x1="258" y1="50" x2="270" y2="128" stroke="#00e5ff" stroke-width="1.4"/>
              <text x="20" y="28" fill="#00ff41" font-family="monospace" font-size="11">3D SCANNER // CAD RIG</text>
            </svg>
          </div>
          <a class="enter-btn" href="./projects.html#hardware">[ENTER]</a>
        </article>

        <!-- Card 3: Off-Grid Lab -->
        <article class="clean-card">
          <div class="card-head">
            <h2 class="card-title">Off-Grid Lab</h2>
            <span class="status-pill">STARTER</span>
          </div>
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
              <line x1="160" y1="24" x2="96" y2="58" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="160" y1="24" x2="224" y2="58" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="96" y1="58" x2="96" y2="112" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="224" y1="58" x2="224" y2="112" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="96" y1="112" x2="160" y2="132" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="224" y1="112" x2="160" y2="132" stroke="#00e5ff" stroke-width="1.8"/>
              <line x1="96" y1="58" x2="224" y2="112" stroke="#00ff41" stroke-width="1.4" stroke-dasharray="4 3"/>
              <line x1="224" y1="58" x2="96" y2="112" stroke="#00ff41" stroke-width="1.4" stroke-dasharray="4 3"/>
              <line x1="160" y1="24" x2="160" y2="132" stroke="#9d4edd" stroke-width="1.4"/>
              <circle cx="160" cy="24" r="8" fill="#03121d" stroke="#00e5ff" stroke-width="2"/>
              <circle cx="96" cy="58" r="8" fill="#03121d" stroke="#00ff41" stroke-width="2"/>
              <circle cx="224" cy="58" r="8" fill="#03121d" stroke="#00e5ff" stroke-width="2"/>
              <circle cx="160" cy="78" r="9" fill="#03121d" stroke="#00ff41" stroke-width="2"/>
              <circle cx="96" cy="112" r="8" fill="#03121d" stroke="#00e5ff" stroke-width="2"/>
              <circle cx="224" cy="112" r="8" fill="#03121d" stroke="#00ff41" stroke-width="2"/>
              <circle cx="160" cy="132" r="7" fill="#03121d" stroke="#00e5ff" stroke-width="2"/>
            </svg>
          </div>
          <a class="enter-btn" href="./projects.html#offgrid">[ENTER]</a>
        </article>

        <!-- Card 4: HTML Sandbox -->
        <article class="clean-card">
          <div class="card-head">
            <h2 class="card-title">HTML Sandbox</h2>
            <span class="status-pill status-pill--live">/LABS/</span>
          </div>
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
              <path d="M84 52 L54 75 L84 98 M124 52 L154 75 L124 98 M112 46 L96 104" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="176" y1="36" x2="176" y2="114" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.5"/>
              <text x="192" y="64" fill="#e8fff0" font-family="monospace" font-size="13" font-weight="700">Shot Couch Coach</text>
              <text x="192" y="96" fill="#00ff41" font-family="monospace" font-size="13" font-weight="700">TRON Grid Test</text>
            </svg>
          </div>
          <a class="enter-btn" href="./labs.html">[ENTER]</a>
        </article>
      </section>
    </main>

    <!-- Zone 3: Single Slim Bottom Command & Toggle Bar -->
    <footer class="mainframe-bottombar">
      <div class="terminal-inline-wrap">
        <form class="terminal-form" id="terminalForm">
          <label class="terminal-prompt-label" for="terminalInput">
            C:\CHAZFAB&gt;<span class="terminal-cursor" aria-hidden="true"></span>
          </label>
          <input
            class="terminal-input"
            id="terminalInput"
            type="text"
            placeholder="type command (help, games, munchers, projects, labs, sysop, grid)..."
            autocomplete="off"
            spellcheck="false"
          >
        </form>
        <span class="terminal-output" id="terminalOutput" aria-live="polite"></span>
      </div>

      <div class="bottom-toggles">
        <label class="toggle-pill"><input type="checkbox" id="gridDrive"> [GRID]</label>
        <label class="toggle-pill"><input type="checkbox" id="sfxToggle"> [SFX]</label>
      </div>
    </footer>
  </div>
</body>
</html>
