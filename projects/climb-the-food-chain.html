    <header class="mainframe-topbar">
      <a class="brand-logo-link" href="../index.html" aria-label="CHAZFAB Home">

        <form class="terminal-form" id="terminalForm">
          <label class="terminal-prompt-label" for="terminalInput">
            C:\CHAZFAB&gt;<span class="terminal-cursor" aria-hidden="true"></span>
          </label>
          <input class="terminal-input" id="terminalInput" type="text" placeholder="games, home, labs, help..." autocomplete="off" spellcheck="false">
        </form>
        <span class="terminal-output" id="terminalOutput" aria-live="polite"></span>
      </div>
      <div class="bottom-toggles">
        <label class="toggle-pill"><input type="checkbox" id="gridDrive"> [GRID]</label>
        <label class="toggle-pill"><input type="checkbox" id="sfxToggle"> [SFX]</label>
