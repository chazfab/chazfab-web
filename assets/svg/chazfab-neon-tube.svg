<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 74" width="420" height="74" role="img" aria-label="CHAZFAB Hollow Neon Green Tube Logo">
  <defs>
    <filter id="tubeBloom" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Phosphor Glow Stroke -->
  <text
    x="10"
    y="56"
    fill="none"
    stroke="#00FF41"
    stroke-width="3.2"
    stroke-linejoin="round"
    filter="url(#tubeBloom)"
    font-family="ui-monospace, 'Cascadia Mono', 'Arial Black', monospace"
    font-size="56"
    font-weight="900"
    letter-spacing="7"
  >CHAZFAB</text>
  <!-- Inner Crisp Hollow Tube Highlight -->
  <text
    x="10"
    y="56"
    fill="#020406"
    stroke="#9EFFB5"
    stroke-width="1"
    stroke-linejoin="round"
    font-family="ui-monospace, 'Cascadia Mono', 'Arial Black', monospace"
    font-size="56"
    font-weight="900"
    letter-spacing="7"
  >CHAZFAB</text>
</svg>
