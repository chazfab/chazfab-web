<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>CHAZFAB // LABS — TRON Grid Coordinate Tester</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020406;
      --cyan: #00e5ff;
      --green: #00ff41;
      --violet: #9d4edd;
      --violet-bar: #5a189a;
      --red: #ff2800;
      --ink: #e2ffe9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      background: linear-gradient(90deg, var(--violet-bar), #240046);
      border-bottom: 2px solid var(--cyan);
      font-size: 0.85rem;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .back-link {
      color: #021406;
      background: var(--green);
      padding: 0.35rem 0.7rem;
      text-decoration: none;
      font-weight: 900;
      border: 1.5px solid #ffffff;
    }

    .back-link--cyan {
      background: var(--cyan);
      color: #021018;
    }

    .back-link:hover {
      background: #ffffff;
      color: #020406;
    }

    .lab-wrap {
      flex: 1;
      max-width: 980px;
      width: 100%;
      margin: 1.25rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1rem;
      background: #050b14;
      border: 2px solid var(--violet);
      font-size: 0.84rem;
    }

    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    select,
    input[type="range"] {
      accent-color: var(--green);
    }

    canvas {
      width: 100%;
      height: 440px;
      display: block;
      background: #020406;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.2);
      cursor: crosshair;
    }

    .readout {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.9rem;
      background: #050b14;
      border: 1.5px solid var(--green);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-actions">
      <a class="back-link" href="../labs.html">&larr; HTML LAB</a>
      <a class="back-link back-link--cyan" href="../index.html">MAINFRAME HOME</a>
    </div>
    <span>FILE: /labs/tron-grid-test.html // STANDALONE HTML SANDBOX DEMO</span>
  </header>

  <main class="lab-wrap">
    <div class="controls">
      <label>
        Mainframe Preset:
        <select id="preset">
          <option value="mainframe">Mainframe: TRON Cyan + Green + Violet (#00E5FF / #00FF41 / #9D4EDD)</option>
          <option value="cyborg">Cyborg: Matrix Green + Cyber Violet + Red (#00FF41 / #9D4EDD / #FF2800)</option>
          <option value="laser">Laser Red + TRON Cyan (#FF2800 / #00E5FF)</option>
        </select>
      </label>

      <label>
        Grid Density:
        <input id="density" type="range" min="8" max="28" value="16">
      </label>

      <span id="statusText">Move cursor across the horizon to steer perspective vanishing point.</span>
    </div>

    <canvas id="gridCanvas" width="940" height="440"></canvas>

    <div class="readout">
      <span id="coords">CURSOR VANISH POINT: X=0.50 Y=0.38</span>
      <span>DROP ANY SINGLE-FILE .HTML INTO /labs/ TO SHARE IT LIKE THIS</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const presetSelect = document.getElementById('preset');
    const densityRange = document.getElementById('density');
    const coordsEl = document.getElementById('coords');

    const palettes = {
      mainframe: { grid: '#00E5FF', horizon: '#9D4EDD', sun: '#00FF41' },
      cyborg: { grid: '#00FF41', horizon: '#9D4EDD', sun: '#FF2800' },
      laser: { grid: '#FF2800', horizon: '#00E5FF', sun: '#E2FFE9' }
    };

    let vx = 0.5;
    let vy = 0.38;

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      const pal = palettes[presetSelect.value];
      const cols = Number(densityRange.value);
      const hy = Math.max(80, Math.min(h - 90, vy * h));
      const vanishX = vx * w;

      ctx.fillStyle = '#020406';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = pal.sun;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(vanishX, hy, 42, Math.PI, 0);
      ctx.stroke();

      ctx.strokeStyle = pal.horizon;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, hy);
      ctx.lineTo(w, hy);
      ctx.stroke();

      ctx.strokeStyle = pal.grid;
      ctx.lineWidth = 1.3;
      for (let i = -cols; i <= cols; i++) {
        const bottomX = vanishX + (i / cols) * w * 1.45;
        ctx.beginPath();
        ctx.moveTo(vanishX, hy);
        ctx.lineTo(bottomX, h);
        ctx.stroke();
      }

      const rows = 14;
      for (let r = 1; r <= rows; r++) {
        const t = Math.pow(r / rows, 2.2);
        const y = hy + t * (h - hy);
        ctx.globalAlpha = 0.25 + 0.75 * t;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      vx = (e.clientX - rect.left) / rect.width;
      vy = Math.min(0.65, Math.max(0.2, (e.clientY - rect.top) / rect.height));
      coordsEl.textContent = `CURSOR VANISH POINT: X=${vx.toFixed(2)} Y=${vy.toFixed(2)}`;
      draw();
    });

    presetSelect.addEventListener('change', draw);
    densityRange.addEventListener('input', draw);
    draw();
  </script>
</body>
</html>
